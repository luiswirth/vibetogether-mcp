[package]
name = "vibe-together-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
base64 = "0.23"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
rmcp = { version = "3.9", features = ["server", "macros", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
agentwire-relay = { git = "https://github.com/luiswirth/agentwire", rev = "8af249ca1edc4f71c8c49ed938fecfbbf5918eea" }
rmcp = { version = "3.9", features = ["client", "transport-streamable-http-client-reqwest"] }
